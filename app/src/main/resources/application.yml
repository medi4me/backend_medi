spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none              # 운영용은 none / 개발용은 update 또는 validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000

  sql:
    init:
      mode: never

  # 하위 설정 파일 병합
  config:
    import:
      - classpath:application-local.yml
      - classpath:application-jwt.yml
      - classpath:application-redis.yml

  profiles:
    active: local, redis                   # 실행 환경 (local, dev, prod 중 선택), Redis 프로필 활성화

# 공공 API, 외부 서비스 등 공통 설정
api:
  mfds: # 식약처
    service-url: "https://apis.data.go.kr/1471000/DrbEasyDrugInfoService"
    service-key: ${MFDS_API_KEY}
  fda:  # 해외약물/최신약물
    base-url: "https://api.fda.gov"
  rxnorm:
    base-url: "https://rxnav.nlm.nih.gov/REST"
  rag:  # Chatbot RAG 검색 서비스 (mediforme-chatbot-rag)
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}
  dur:  # 식약처 DUR 병용금기 (data.go.kr 15059486) — 서비스키는 MFDS 키 재사용
    service-url: "https://apis.data.go.kr/1471000/DURPrdlstInfoService03/getUsjntTabooInfoList03"
    service-key: ${MFDS_API_KEY}



google:
  cloud:
    vision:
      credentials:
        path: ${GOOGLE_APPLICATION_CREDENTIALS}

coolsms:
  api:
    key: ${COOLSMS_API_KEY:}
    secret: ${COOLSMS_API_SECRET:}
    sender: ${COOLSMS_API_SENDER:}

# Actuator / Micrometer
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mediforme